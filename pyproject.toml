[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claim-prep"
version = "0.1.0"
description = "Pre-call briefs for open B2B deals: questions to ask and objections to expect, grounded in past wins."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vihas Adi" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.40",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
claim-prep = "claim_prep.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claim_prep = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF012"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]
